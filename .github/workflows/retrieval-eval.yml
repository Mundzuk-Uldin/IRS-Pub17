name: retrieval-eval

# Retrieval-only: no API key, no database, no spend. Deliberately not on every
# push -- run it by hand, or it runs on pull requests that change the pipeline
# or the eval. It fails if the corpus changed or strict recall@5 drops more
# than one question below the adopted 98.3%.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pub17/**"
      - "eval/**"
      - "scripts/ingest.py"
      - "requirements.txt"

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-bge-reranker-base
      - name: Fetch and verify the corpus
        run: ./scripts/download_corpus.sh
      - name: Eval set is still grounded in the corpus
        run: python eval/verify_questions.py
      - name: Retrieval recall (section chunks + reranking)
        run: python eval/baseline_numpy.py --min-recall5 96.7
